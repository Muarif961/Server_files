stages:
- name: Build
  steps:
  - runScriptConfig:
      image: node:12
      shellScript: npm i
- name: Publish
  steps:
  - publishImageConfig:
      dockerfilePath: ./Dockerfile
      buildContext: .
      tag: zzzapi-users:${CICD_EXECUTION_SEQUENCE}
- name: Deploy
  steps:
  - applyYamlConfig:
      path: ./deployment.yaml
    env:
      MONGO_DB: device?replicaSet=rs0
      MONGO_HOST: mongodb-users-replicaset-mongodb-replicaset.mongodb-replicaset.svc.cluster.local
      MONGO_PORT: "27017"
      PORT: "80"
timeout: 60
notification: {}
