kind: Service
apiVersion: v1
metadata:
  name: bloodhound-fetcher-service
spec:
  selector:
    app: bloodhound-fetcher
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bloodhound-fetcher-deployment
  labels:
    app: bloodhound-fetcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bloodhound-fetcher
  template:
    metadata:
      labels:
        app: bloodhound-fetcher
    spec:
      imagePullSecrets:
        - name: pipeline-docker-registry
      containers:
        - name: bloodhound-fetcher
          image: ${CICD_IMAGE}:${CICD_EXECUTION_SEQUENCE}
          ports:
            - containerPort: 80