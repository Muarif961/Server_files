kind: Service
apiVersion: v1
metadata:
  name: zzzapi-geoservice-service
spec:
  selector:
    app: zzzapi-geoservice
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zzzapi-geoservice-deployment
  labels:
    app: zzzapi-geoservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zzzapi-geoservice
  template:
    metadata:
      labels:
        app: zzzapi-geoservice
    spec:
      imagePullSecrets:
        - name: pipeline-docker-registry
      containers:
        - name: zzzapi-geoservice
          image: ${CICD_IMAGE}:${CICD_EXECUTION_SEQUENCE}
          ports:
            - containerPort: 80